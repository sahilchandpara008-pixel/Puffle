name: Repair v1.0.12 AAB signatures
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-v1.0.12.yml', 'tool/repair_puffle_release.py', 'tool/puffle-v1.0.12-signatures.json.gz.b64']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repair-puffle-v1.0.12
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Download current public release payloads
        run: |
          mkdir release
          gh release download v1.0.12 --dir release --pattern 'Puffle.apk' --pattern 'Puffle-ads.apk' --pattern '*.aab' --pattern 'checksums.txt' --pattern 'Puffle-Play-Console-kit-v1.0.12.zip'
          (cd release && sha256sum -c checksums.txt)
      - name: Apply verified public signatures and rebuild ZIPs
        run: python tool/repair_puffle_release.py release
      - name: Publish verified replacements
        run: |
          gh release upload v1.0.12 release/Puffle-play.aab release/Puffle-play-with-plans.aab release/Puffle-apks-v1.0.12.zip release/Puffle-Play-Console-kit-v1.0.12.zip release/checksums.txt release/release-signing-verification.json --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: Puffle-v1.0.12-release-signed
          path: |
            release/*.aab
            release/*.zip
            release/checksums.txt
            release/release-signing-verification.json
