name: Import Orbix source files into Puffle
on:
  push:
    paths:
      - '.github/workflows/import-orbix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Puffle
        uses: actions/checkout@v4
      - name: Copy source without modifying Orbix or Puffle workflows
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/liveperfumes7-crypto/Orbix.git /tmp/orbix-original
          rsync -a --exclude='.git/' --exclude='.github/workflows/' /tmp/orbix-original/ ./
          git add --all
          if git diff --cached --quiet; then
            echo 'Original project files already copied.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Import unmodified original Orbix project files'
          git push origin HEAD:main
