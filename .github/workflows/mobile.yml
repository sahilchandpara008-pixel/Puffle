name: mobile
on:
  workflow_dispatch:
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml", "tool/embed_native_symbols.py"]
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml", "tool/embed_native_symbols.py"]
env:
  FLUTTER_VERSION: "3.27.4"   # pinned
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - run: python ../tool/check_app_identity.py
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", cache: true }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Generate Android scaffolding (keeps files already in the repo)
        run: flutter create --platforms=android --org com.puffle --project-name puffle . && rm -f android/app/build.gradle && sed -i "s/com.android.application\" version \"[0-9.]*\"/com.android.application\" version \"8.1.4\"/" android/settings.gradle
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Play-build test (PLAY_STORE=true)
        run: flutter test --dart-define=PLAY_STORE=true
      - name: Plans build payment test
        run: flutter test test/upi_test.dart test/version_test.dart --dart-define=PLAY_STORE=true --dart-define=PLAY_SELLS_UPI=true
  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults: { run: { working-directory: mobile } }
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Require Puffle release signing
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for value in "$KEYSTORE_B64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            test -n "$value" || { echo '::error::Puffle signing secrets are required. Refusing a debug-signed release.'; exit 1; }
          done
      - run: python ../tool/check_app_identity.py
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", cache: true }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: flutter create --platforms=android --org com.puffle --project-name puffle . && rm -f android/app/build.gradle && sed -i "s/com.android.application\" version \"[0-9.]*\"/com.android.application\" version \"8.1.4\"/" android/settings.gradle
      - run: flutter pub get
      - name: Kotlin unit tests (UPI result conversion)
        run: cd android && ./gradlew :app:testDirectDebugUnitTest
      - name: Write signing config from secrets (never committed)
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,os
          values={k:os.environ.get(k,'') for k in ['KEYSTORE_B64','STORE_PASSWORD','KEY_ALIAS','KEY_PASSWORD']}
          assert all(values.values()),'All Puffle release signing secrets are required'
          key=Path('android/release.jks');key.write_bytes(base64.b64decode(values['KEYSTORE_B64'],validate=True));key.chmod(0o600)
          def escaped(value):
            return ''.join('\\u%04x'%ord(c) if ord(c)<32 or ord(c)>126 else '\\'+c if c in '\\ =:#!' else c for c in value)
          properties=Path('android/key.properties')
          properties.write_text('storeFile=../release.jks\n'+''.join(k+'='+escaped(v)+'\n' for k,v in [('storePassword',values['STORE_PASSWORD']),('keyAlias',values['KEY_ALIAS']),('keyPassword',values['KEY_PASSWORD'])]),encoding='ascii');properties.chmod(0o600)
          PY
      - name: Website APK (direct)
        run: flutter build apk --release --flavor direct --dart-define=AUTH_SCHEME=com.pufflecloud.app
      - run: cp build/app/outputs/flutter-apk/app-direct-release.apk ../Puffle.apk
      - name: Ads APK (direct + referrer define)
        run: flutter build apk --release --flavor direct --dart-define=AUTH_SCHEME=com.pufflecloud.app --dart-define=APK_REFERRER="utm_source=meta&utm_medium=paid_social&utm_campaign=apk_download"
      - run: cp build/app/outputs/flutter-apk/app-direct-release.apk ../Puffle-ads.apk
      - name: Play AAB
        run: flutter build appbundle --release --flavor play --split-debug-info=build/dart-symbols/play --dart-define=PLAY_STORE=true --dart-define=AUTH_SCHEME=com.pufflecloud.app
      - run: cp build/app/outputs/bundle/playRelease/app-play-release.aab ../Puffle-play.aab
      - name: Embed exact Play native symbols
        run: python ../tool/embed_native_symbols.py --bundle ../Puffle-play.aab --dart-dir build/dart-symbols/play --output ../native-symbols/Puffle-play-native-symbols
      - name: Play AAB with plans (UPI payments ON, owner's choice)
        run: flutter build appbundle --release --flavor play --split-debug-info=build/dart-symbols/play-plans --dart-define=PLAY_STORE=true --dart-define=PLAY_SELLS_UPI=true --dart-define=AUTH_SCHEME=com.pufflecloud.app
      - run: cp build/app/outputs/bundle/playRelease/app-play-release.aab ../Puffle-play-with-plans.aab
      - name: Embed exact plans AAB native symbols
        run: python ../tool/embed_native_symbols.py --bundle ../Puffle-play-with-plans.aab --dart-dir build/dart-symbols/play-plans --output ../native-symbols/Puffle-plans-native-symbols
      - name: Sign bundles with embedded debug symbols
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for bundle in ../Puffle-play.aab ../Puffle-play-with-plans.aab; do
            jarsigner -keystore android/release.jks -storepass:env STORE_PASSWORD -keypass:env KEY_PASSWORD "$bundle" "$KEY_ALIAS"
          done
      - name: Validate symbol metadata and app bundles
        working-directory: .
        run: |
          curl --fail --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$RUNNER_TEMP/bundletool.jar"
          for bundle in Puffle-play.aab Puffle-play-with-plans.aab; do
            python tool/embed_native_symbols.py --bundle "$bundle" --verify-only
            java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$bundle"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Puffle-native-debug-symbols
          path: |
            native-symbols/Puffle-play-native-symbols.zip
            native-symbols/Puffle-plans-native-symbols.zip
            native-symbols/Puffle-play-native-symbols/verification.json
            native-symbols/Puffle-plans-native-symbols/verification.json
      - name: Checksums and manifest checks
        working-directory: .
        run: |
          python tool/check_app_identity.py Puffle.apk Puffle-ads.apk Puffle-play.aab Puffle-play-with-plans.aab
          sha256sum Puffle.apk Puffle-ads.apk Puffle-play.aab Puffle-play-with-plans.aab | tee checksums.txt
          # merged-manifest assertions
          M=$(find mobile/build -path '*merged_manifests*' -path '*irectRelease*' -name AndroidManifest.xml | head -1)
          echo "manifest: $M"; test -n "$M" || (echo 'merged manifest not found'; exit 1)
          grep -q 'com.pufflecloud.app' "$M" || (echo 'Puffle package missing'; exit 1)
          ! grep -q 'permission.AD_ID' "$M" || (echo 'AD_ID present'; exit 1)
      - name: Verify release signature
        working-directory: .
        env:
          SIGN_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SIGN_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          EXPECTED=$(keytool -list -v -keystore mobile/android/release.jks -alias "$SIGN_ALIAS" -storepass:env SIGN_PASSWORD | sed -n 's/.*SHA256: //p' | head -1)
          test -n "$EXPECTED" || { echo 'Missing expected upload certificate'; exit 1; }
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          for f in Puffle.apk Puffle-ads.apk; do
            got=$($AS verify --print-certs $f | grep "SHA-256 digest" | head -1 | sed 's/.*: //' | tr a-f A-F | sed 's/../&:/g; s/:$//')
            echo "$f -> $got"
            [ "$got" = "$EXPECTED" ] || { echo "Signature mismatch for $f"; exit 1; }
          done
          for f in Puffle-play.aab Puffle-play-with-plans.aab; do
            jarsigner -verify "$f" | grep -q 'jar verified.'
            cert=$(keytool -printcert -jarfile "$f")
            ! echo "$cert" | grep -qi 'Android Debug' || { echo "Debug certificate rejected: $f"; exit 1; }
            got=$(echo "$cert" | sed -n 's/.*SHA256: //p' | head -1)
            [ "$got" = "$EXPECTED" ] || { echo "Bundle certificate mismatch: $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Puffle-apks
          path: |
            Puffle.apk
            Puffle-ads.apk
            Puffle-play.aab
            Puffle-play-with-plans.aab
            checksums.txt
      - name: Publish public release (latest)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.KEYSTORE_B64 != ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Puffle (latest)" --notes "Latest signed Puffle builds. Puffle.apk is the website download; Puffle-ads.apk is for ad campaigns." --latest=false
          gh release upload latest Puffle.apk Puffle-ads.apk checksums.txt --clobber
      - name: Publish Play upload bundles (download link for the Play Console)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.KEYSTORE_B64 != ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view play-upload >/dev/null 2>&1 || gh release create play-upload --title "Puffle Play bundles" --notes "Signed AABs for upload to Google Play Console." --prerelease --latest=false
          gh release upload play-upload Puffle-play-with-plans.aab Puffle-play.aab checksums.txt --clobber
      - name: Remove temporary signing files
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['android/release.jks','android/key.properties']:
            Path(name).unlink(missing_ok=True)
          PY
