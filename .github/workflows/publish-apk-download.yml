name: Publish APK download
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/publish-apk-download.yml"]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Puffle-apks
          run-id: 43593784009
          github-token: ${{ github.token }}
      - name: Verify build checksums
        run: sha256sum -c checksums.txt
      - name: Publish direct APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v1.0.5 >/dev/null 2>&1 || gh release create v1.0.5 --target main --title "Puffle v1.0.5" --notes "Updated browsing grids, video suggestions and next/previous controls, and admin approval for channel videos. Install Puffle.apk." --latest
          gh release upload v1.0.5 Puffle.apk Puffle-ads.apk checksums.txt --clobber
