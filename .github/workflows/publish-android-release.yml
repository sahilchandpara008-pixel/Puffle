name: Publish successful Android release
on:
  workflow_run:
    workflows: [mobile]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check this is the newest mobile build
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          latest=$(gh api "repos/$GH_REPO/actions/workflows/mobile.yml/runs?branch=main&per_page=1" --jq '.workflow_runs[0].id')
          if [ "$latest" = "$RUN_ID" ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; else echo "publish=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.current.outputs.publish == 'true'
        with:
          name: Puffle-apks
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - run: sha256sum -c checksums.txt
        if: steps.current.outputs.publish == 'true'
      - name: Publish verified APKs
        if: steps.current.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(gh api "repos/$GH_REPO/contents/mobile/pubspec.yaml?ref=$BUILD_SHA" --jq .content | base64 -d | sed -n 's/^version: *//p' | tr -d '\r')
          version="${version%%+*}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release view "v$version" >/dev/null 2>&1 || gh release create "v$version" --target main --title "Puffle v$version" --notes "Verified Android build ($BUILD_SHA). Install Puffle.apk; Puffle-ads.apk preserves ad attribution." --latest
          gh release upload "v$version" Puffle.apk Puffle-ads.apk checksums.txt --clobber
